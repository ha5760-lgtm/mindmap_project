<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Atlas — Youngmin's Dashboard Library</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://unpkg.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #07080d;
    --bg-1: #0c0e16;
    --bg-2: #131726;
    --surface: rgba(20, 24, 40, 0.72);
    --surface-2: rgba(28, 33, 52, 0.85);
    --border: rgba(148, 163, 184, 0.10);
    --border-strong: rgba(148, 163, 184, 0.18);
    --text-1: #f1f5f9;
    --text-2: #cbd5e1;
    --text-3: #94a3b8;
    --text-4: #64748b;
    --accent-blue: #60a5fa;
    --accent-purple: #c084fc;
    --accent-green: #4ade80;
    --accent-amber: #fbbf24;
    --shadow-lg: 0 24px 60px -12px rgba(0,0,0,0.7), 0 8px 24px -6px rgba(0,0,0,0.5);
    --font-sans: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg-0); color: var(--text-1);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden; height: 100vh; width: 100vw;
  }

  #app {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(1200px 800px at 20% -10%, rgba(96,165,250,0.08), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(192,132,252,0.07), transparent 60%),
      radial-gradient(700px 500px at 50% 50%, rgba(74,222,128,0.04), transparent 60%),
      var(--bg-0);
  }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
    display: flex; align-items: center; padding: 0 20px; gap: 16px;
    background: linear-gradient(180deg, rgba(7,8,13,0.92), rgba(7,8,13,0.65));
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, #60a5fa, #c084fc);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px -4px rgba(96,165,250,0.5); position: relative;
  }
  .brand-mark::after {
    content: ''; position: absolute; inset: 1px; border-radius: 7px;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  }
  .brand-mark svg { width: 16px; height: 16px; color: #0a0e1a; position: relative; z-index: 1; }
  .brand-name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: var(--text-1); }
  .brand-sub { font-size: 11px; color: var(--text-4); margin-left: 2px; font-weight: 500; }
  .brand-divider { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
  .crumb { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
  .crumb b { color: var(--text-1); font-weight: 600; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 11.5px; font-weight: 500; color: var(--text-2); line-height: 1;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
  .pill-num { color: var(--accent-blue); font-variant-numeric: tabular-nums; font-weight: 600; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--text-3); display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; transition: all 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.09); color: var(--text-1); border-color: var(--border-strong); }
  .icon-btn svg { width: 15px; height: 15px; }

  #sidebar {
    position: fixed; left: 16px; top: 76px; bottom: 76px; width: 240px; z-index: 60;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  }
  .side-title {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-4); padding: 4px 8px;
  }
  .side-section { display: flex; flex-direction: column; gap: 4px; }
  .side-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s; font-size: 13px; color: var(--text-2);
    border: 1px solid transparent;
  }
  .side-item:hover { background: rgba(255,255,255,0.04); color: var(--text-1); }
  .side-item.active { background: rgba(96,165,250,0.1); color: var(--text-1); border-color: rgba(96,165,250,0.18); }
  .side-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .side-count {
    margin-left: auto; font-size: 11px; color: var(--text-4);
    font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.04);
    padding: 2px 7px; border-radius: 10px; font-weight: 500;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    padding: 10px; border-radius: 10px;
  }
  .stat-label {
    font-size: 10px; color: var(--text-4); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 600; margin-bottom: 3px;
  }
  .stat-value {
    font-size: 17px; font-weight: 700; color: var(--text-1);
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .stat-value .unit { font-size: 10px; color: var(--text-4); margin-left: 2px; font-weight: 500; }

  #canvas-container { position: absolute; inset: 0; cursor: grab; }
  #canvas-container.grabbing { cursor: grabbing; }
  svg#mindmap { width: 100%; height: 100%; display: block; }
  /* Hover feedback uses circle radius/opacity — NO CSS transform on .leaf-node
     because that would override the SVG translate(x,y) attribute. */
  .leaf-node circle.bg, .leaf-node circle.halo { transition: r 0.18s ease, opacity 0.18s ease; }

  #bottombar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 4px; padding: 6px;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-lg);
  }
  .ctl-btn {
    height: 34px; min-width: 34px; padding: 0 10px;
    border-radius: 9px; background: transparent; border: none;
    color: var(--text-3); font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; transition: all 0.15s;
  }
  .ctl-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-1); }
  .ctl-btn svg { width: 15px; height: 15px; }
  .ctl-divider { width: 1px; height: 18px; background: var(--border-strong); margin: 0 2px; }
  .zoom-display {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3);
    padding: 0 8px; font-variant-numeric: tabular-nums;
    min-width: 48px; text-align: center;
  }

  #tooltip {
    position: fixed; z-index: 200;
    background: rgba(15, 18, 30, 0.96); border: 1px solid var(--border-strong);
    backdrop-filter: blur(12px); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; pointer-events: none; display: none;
    max-width: 240px; box-shadow: var(--shadow-lg);
    transform: translate(8px, -50%);
  }
  #tooltip .tt-title { font-weight: 600; color: var(--text-1); margin-bottom: 3px; }
  #tooltip .tt-desc { color: var(--text-3); font-size: 11.5px; line-height: 1.5; }
  #tooltip .tt-meta {
    display: flex; gap: 8px; margin-top: 6px; font-size: 10.5px;
    color: var(--text-4); font-family: var(--font-mono);
  }

  #popup-backdrop {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(7, 8, 13, 0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  #popup-backdrop.open { opacity: 1; pointer-events: auto; }

  .phone {
    position: fixed; z-index: 160; width: 380px; height: 720px;
    border-radius: 38px;
    background: linear-gradient(180deg, #1a1d2a, #0f1119);
    padding: 12px 10px 14px;
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,0.06),
      0 0 0 8px rgba(20,22,32,0.8),
      0 0 0 9.5px rgba(255,255,255,0.04),
      0 36px 80px -20px rgba(0,0,0,0.85),
      0 12px 32px -8px rgba(0,0,0,0.6);
    transform-origin: var(--anchor-x, 50%) var(--anchor-y, 50%);
    transform: scale(0.6); opacity: 0;
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
    pointer-events: none; display: flex; flex-direction: column;
  }
  .phone.open { opacity: 1; transform: scale(1); pointer-events: auto; }

  .phone-screen {
    flex: 1; border-radius: 28px; overflow: hidden;
    background: #0f172a; position: relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .phone-status {
    position: absolute; top: 0; left: 0; right: 0; height: 36px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; z-index: 4; pointer-events: none;
    color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .phone-status .time { letter-spacing: -0.01em; }
  .phone-status .right { display: flex; align-items: center; gap: 5px; }
  .phone-notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #000; border-radius: 22px;
    z-index: 5; pointer-events: none;
  }
  .phone-iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #0f172a; padding-top: 36px;
  }
  .phone-iframe-loading {
    position: absolute; inset: 36px 0 0 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--text-3); background: #0f172a; z-index: 3;
  }
  .phone-iframe-loading.hidden { display: none; }
  .phone-iframe-loading .spinner {
    width: 36px; height: 36px;
    border: 2.5px solid rgba(96,165,250,0.15);
    border-top-color: #60a5fa; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .phone-tab {
    position: absolute; top: -56px; left: 12px; right: 12px; height: 44px;
    background: var(--surface-2); backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong); border-radius: 12px;
    display: flex; align-items: center; padding: 0 8px 0 14px; gap: 8px;
    box-shadow: var(--shadow-lg);
  }
  .phone-tab .tab-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .phone-tab .tab-title {
    font-size: 13px; font-weight: 600; color: var(--text-1); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em;
  }
  .phone-tab .tab-icon-btn {
    width: 30px; height: 30px; border: none;
    background: rgba(255,255,255,0.04); color: var(--text-3);
    border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .phone-tab .tab-icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }
  .phone-tab .tab-icon-btn svg { width: 14px; height: 14px; }

  .phone-meta {
    position: absolute; bottom: -52px; left: 12px; right: 12px;
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
  }
  .phone-meta .chip {
    font-size: 10.5px; color: var(--text-3);
    background: var(--surface-2); backdrop-filter: blur(16px);
    border: 1px solid var(--border); padding: 4px 9px; border-radius: 999px;
    font-weight: 500; font-family: var(--font-mono); letter-spacing: -0.01em;
  }
  .phone-meta .chip b { color: var(--text-1); font-weight: 600; }

  #hint {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--surface); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px 7px 12px; font-size: 12px; color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px -10px rgba(0,0,0,0.4);
    transition: opacity 0.4s, transform 0.4s;
  }
  #hint.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-8px); }
  #hint .kbd {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border-strong);
    color: var(--text-2); font-family: var(--font-mono);
    font-size: 10.5px; padding: 2px 6px; border-radius: 5px; font-weight: 500;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.3); }

  @media (max-width: 900px) { #sidebar { display: none; } }
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <circle cx="5" cy="5" r="2"/>
          <circle cx="19" cy="5" r="2"/>
          <circle cx="5" cy="19" r="2"/>
          <circle cx="19" cy="19" r="2"/>
          <path d="M7 7l3 3M14 14l3 3M14 10l3-3M7 17l3-3"/>
        </svg>
      </div>
      <span class="brand-name">Knowledge Atlas</span>
      <span class="brand-sub">v2</span>
    </div>
    <div class="brand-divider"></div>
    <div class="crumb">Workspace · <b>Youngmin</b> · Dashboard Library</div>
    <div class="top-right">
      <span class="pill"><span class="dot"></span>Live · <span class="pill-num">8</span> dashboards</span>
      <button class="icon-btn" id="btn-help" title="키보드 단축키">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </header>

  <aside id="sidebar">
    <div class="side-title">Categories</div>
    <div class="side-section" id="cat-filter">
      <div class="side-item active" data-cat="all"><span class="side-dot" style="background:#cbd5e1"></span>전체 보기<span class="side-count">8</span></div>
      <div class="side-item" data-cat="cat-semi"><span class="side-dot" style="background:#60a5fa"></span>반도체 · 광학<span class="side-count">3</span></div>
      <div class="side-item" data-cat="cat-invest"><span class="side-dot" style="background:#c084fc"></span>투자 · 분석<span class="side-count">4</span></div>
      <div class="side-item" data-cat="cat-ai"><span class="side-dot" style="background:#4ade80"></span>AI · 기술<span class="side-count">1</span></div>
    </div>
    <div class="side-title" style="margin-top:6px">Library Stats</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Files</div><div class="stat-value">8</div></div>
      <div class="stat"><div class="stat-label">Lines</div><div class="stat-value">6.2<span class="unit">K</span></div></div>
      <div class="stat"><div class="stat-label">Size</div><div class="stat-value">348<span class="unit">KB</span></div></div>
      <div class="stat"><div class="stat-label">Tags</div><div class="stat-value">25</div></div>
    </div>
    <div class="side-title" style="margin-top:6px">Top by Size</div>
    <div class="side-section" id="recent-list"></div>
  </aside>

  <div id="hint">
    <span>노드를 클릭하면 미리보기가 열립니다</span>
    <span class="kbd">Esc</span>
    <span style="opacity:.5">닫기</span>
  </div>

  <div id="canvas-container">
    <svg id="mindmap" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="cat-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
        <linearGradient id="cat-purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6b21a8"/></linearGradient>
        <linearGradient id="cat-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
        <radialGradient id="center-grad" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#475569"/><stop offset="60%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></radialGradient>
        <linearGradient id="leaf-blue" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(96,165,250,0.18)"/><stop offset="100%" stop-color="rgba(30,64,175,0.14)"/></linearGradient>
        <linearGradient id="leaf-purple" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(192,132,252,0.18)"/><stop offset="100%" stop-color="rgba(107,33,168,0.14)"/></linearGradient>
        <linearGradient id="leaf-green" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(74,222,128,0.18)"/><stop offset="100%" stop-color="rgba(4,120,87,0.14)"/></linearGradient>
      </defs>
      <g id="grid-pattern" opacity="0.5"></g>
      <g id="graph-group">
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
  </div>

  <div id="bottombar">
    <button class="ctl-btn" id="btn-zoom-out" title="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <span class="zoom-display" id="zoom-display">100%</span>
    <button class="ctl-btn" id="btn-zoom-in" title="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <span class="ctl-divider"></span>
    <button class="ctl-btn" id="btn-fit" title="화면에 맞추기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/></svg><span>Fit</span></button>
    <button class="ctl-btn" id="btn-reset" title="초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>

  <div id="tooltip"></div>

  <div id="popup-backdrop"></div>
  <div class="phone" id="phone">
    <div class="phone-tab">
      <span class="tab-cat-dot" id="tab-dot"></span>
      <span class="tab-title" id="tab-title">—</span>
      <button class="tab-icon-btn" id="tab-refresh" title="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="tab-icon-btn" id="tab-expand" title="새 탭에서 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
      <button class="tab-icon-btn" id="tab-close" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

          <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="2" y="2" width="14" height="7" rx="1" fill="currentColor"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/></svg>

<script id="jsx-data" type="application/json">{"InterferometerComparison.jsx":"import React, { useState, useEffect, useRef } from 'react';\nimport { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, AreaChart, Area } from 'recharts';\n\nexport default function InterferometerComparison() {\n  const [activeTab, setActiveTab] = useState('michelson');\n  const [time, setTime] = useState(0);\n  const [phaseShift, setPhaseShift] = useState(0);\n  const [isAnimating, setIsAnimating] = useState(true);\n\n  useEffect(() => {\n    if (!isAnimating) return;\n    const interval = setInterval(() => {\n      setTime(t => t + 0.05);\n    }, 30);\n    return () => clearInterval(interval);\n  }, [isAnimating]);\n\n  // 신호 데이터 생성\n  const generateMichelsonData = () => {\n    const data = [];\n    for (let x = 0; x <= 4 * Math.PI; x += 0.1) {\n      const intensity = 0.5 + 0.5 * Math.cos(x + phaseShift);\n      data.push({\n        x: x.toFixed(2),\n        intensity: intensity,\n        dc: 0.5,\n      });\n    }\n    return data;\n  };\n\n  const generateHeterodyneData = () => {\n    const data = [];\n    const f1 = 1.0;\n    const f2 = 1.1; // 주파수 차이 = 비트 주파수\n    for (let t = 0; t <= 20; t += 0.1) {\n      const beam1 = Math.cos(2 * Math.PI * f1 * t);\n      const beam2 = Math.cos(2 * Math.PI * f2 * t + phaseShift);\n      const beat = beam1 + beam2;\n      const detected = 1 + Math.cos(2 * Math.PI * (f2 - f1) * t + phaseShift);\n      data.push({\n        t: t.toFixed(2),\n        beam1: beam1,\n        beam2: beam2,\n        detected: detected / 2,\n      });\n    }\n    return data;\n  };\n\n  const michelsonData = generateMichelsonData();\n  const heterodyneData = generateHeterodyneData();\n\n  // 비교표 데이터\n  const comparisonRows = [\n    { feature: '광원', michelson: '단일 주파수 (f₀)', heterodyne: '두 주파수 (f₁, f₂)', icon: '💡' },\n    { feature: '주파수 분리', michelson: '없음', heterodyne: 'AOM 또는 Zeeman 분리', icon: '🔀' },\n    { feature: '검출 신호', michelson: 'DC 강도 (정적)', heterodyne: 'AC 비트 신호 (Δf)', icon: '📡' },\n    { feature: '신호 형태', michelson: 'I = I₀(1+cos φ)', heterodyne: 'I = I₀cos(2π·Δf·t + φ)', icon: '〰️' },\n    { feature: '위상 측정', michelson: '강도→위상 (모호함)', heterodyne: '시간차→위상 (정확)', icon: '⏱️' },\n    { feature: '광원 변동 영향', michelson: '직접 영향 (큼)', heterodyne: '비트 주파수 무관 (작음)', icon: '🛡️' },\n    { feature: 'DC 노이즈', michelson: '취약함', heterodyne: '면역 (AC 검출)', icon: '🔇' },\n    { feature: '분해능', michelson: 'λ/2 ~ λ/100', heterodyne: 'λ/4096 이하 (sub-nm)', icon: '🎯' },\n    { feature: '주요 응용', michelson: 'LIGO, 표면측정, 학술', heterodyne: 'ASML 노광기, 정밀계측', icon: '🏭' },\n  ];\n\n  // ASML 응용 데이터\n  const applicationsData = [\n    { name: 'Wafer Stage', resolution: 0.05, type: 'Heterodyne' },\n    { name: 'Reticle Stage', resolution: 0.08, type: 'Heterodyne' },\n    { name: 'LIGO 중력파', resolution: 1e-15, type: 'Michelson' },\n    { name: '표면 측정', resolution: 10, type: 'Michelson' },\n  ];\n\n  return (\n    <div className=\"min-h-screen bg-slate-950 text-slate-100 p-6\" style={{ fontFamily: \"'Pretendard', 'Noto Sans KR', system-ui, sans-serif\" }}>\n      <style>{`\n        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n        @keyframes wave-flow {\n          0% { stroke-dashoffset: 0; }\n          100% { stroke-dashoffset: -40; }\n        }\n        @keyframes pulse-glow {\n          0%, 100% { opacity: 0.4; }\n          50% { opacity: 1; }\n        }\n        .glow-cyan { filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6)); }\n        .glow-amber { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.6)); }\n        .glow-pink { filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.6)); }\n        .glow-green { filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.6)); }\n      `}<\/style>\n\n      <div className=\"max-w-7xl mx-auto\">\n        {/* 헤더 */}\n        <header className=\"mb-8 border-l-4 border-cyan-400 pl-6\">\n          <div className=\"text-xs tracking-[0.3em] text-cyan-400 mb-2\">OPTICAL METROLOGY · 광학 간섭계 비교<\/div>\n          <h1 className=\"text-4xl md:text-5xl font-bold mb-3 tracking-tight\">\n            Michelson <span className=\"text-slate-500\">vs<\/span> <span className=\"text-amber-400\">Heterodyne<\/span> 간섭계\n          <\/h1>\n          <p className=\"text-slate-400 text-lg\">두 가지 간섭계 방식의 광학 구조와 신호 검출 원리 비교<\/p>\n        <\/header>\n\n        {/* 핵심 차이 요약 */}\n        <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4 mb-8\">\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur\">\n            <div className=\"text-xs text-slate-500 mb-1\">핵심 차이<\/div>\n            <div className=\"text-2xl font-bold text-cyan-400\">광원 주파수<\/div>\n            <div className=\"text-sm text-slate-400 mt-2\">Michelson: 단일 f₀ / Heterodyne: f₁, f₂ 두 주파수<\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur\">\n            <div className=\"text-xs text-slate-500 mb-1\">검출 방식<\/div>\n            <div className=\"text-2xl font-bold text-amber-400\">DC vs AC<\/div>\n            <div className=\"text-sm text-slate-400 mt-2\">Michelson: 강도 측정 / Heterodyne: 비트 주파수 위상<\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-5 backdrop-blur\">\n            <div className=\"text-xs text-slate-500 mb-1\">분해능<\/div>\n            <div className=\"text-2xl font-bold text-pink-400\">~10000배<\/div>\n            <div className=\"text-sm text-slate-400 mt-2\">Heterodyne가 노이즈 면역성·분해능에서 압도적 우위<\/div>\n          <\/div>\n        <\/div>\n\n        {/* 탭 네비게이션 */}\n        <div className=\"flex gap-2 mb-6 border-b border-slate-800\">\n          {[\n            { id: 'michelson', label: '01 · Michelson 간섭계', color: 'cyan' },\n            { id: 'heterodyne', label: '02 · Heterodyne 간섭계', color: 'amber' },\n            { id: 'compare', label: '03 · 직접 비교', color: 'pink' },\n          ].map(tab => (\n            <button\n              key={tab.id}\n              onClick={() => setActiveTab(tab.id)}\n              className={`px-5 py-3 text-sm font-medium tracking-wide transition-all ${\n                activeTab === tab.id\n                  ? `text-${tab.color}-400 border-b-2 border-${tab.color}-400`\n                  : 'text-slate-500 hover:text-slate-300'\n              }`}\n              style={{\n                color: activeTab === tab.id ? (tab.color === 'cyan' ? '#22d3ee' : tab.color === 'amber' ? '#fbbf24' : '#f472b6') : undefined,\n                borderColor: activeTab === tab.id ? (tab.color === 'cyan' ? '#22d3ee' : tab.color === 'amber' ? '#fbbf24' : '#f472b6') : undefined,\n              }}\n            >\n              {tab.label}\n            <\/button>\n          ))}\n        <\/div>\n\n        {/* Michelson 탭 */}\n        {activeTab === 'michelson' && (\n          <div className=\"space-y-6\">\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h2 className=\"text-2xl font-bold mb-1 text-cyan-400\">Michelson 간섭계 구조<\/h2>\n              <p className=\"text-slate-400 text-sm mb-6\">단일 주파수 광원을 빔스플리터로 분리하여 두 경로의 광로차를 측정<\/p>\n\n              <svg viewBox=\"0 0 700 400\" className=\"w-full h-auto bg-slate-950 rounded-lg border border-slate-800\">\n                {/* 그리드 배경 */}\n                <defs>\n                  <pattern id=\"grid1\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\n                    <path d=\"M 20 0 L 0 0 0 20\" fill=\"none\" stroke=\"#1e293b\" strokeWidth=\"0.5\"/>\n                  <\/pattern>\n                <\/defs>\n                <rect width=\"700\" height=\"400\" fill=\"url(#grid1)\"/>\n\n                {/* 광원 (Laser) */}\n                <rect x=\"30\" y=\"180\" width=\"60\" height=\"40\" fill=\"#0f172a\" stroke=\"#22d3ee\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"60\" y=\"205\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"11\" fontWeight=\"bold\">LASER<\/text>\n                <text x=\"60\" y=\"240\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"10\">f₀ (단일)<\/text>\n\n                {/* 입사 빔 */}\n                <line x1=\"90\" y1=\"200\" x2=\"300\" y2=\"200\" stroke=\"#22d3ee\" strokeWidth=\"2.5\" className=\"glow-cyan\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,200;200,0\" dur=\"2s\" repeatCount=\"indefinite\"/>\n                <\/line>\n\n                {/* 빔스플리터 */}\n                <g transform=\"translate(300, 200) rotate(45)\">\n                  <rect x=\"-25\" y=\"-2\" width=\"50\" height=\"4\" fill=\"#94a3b8\" opacity=\"0.7\"/>\n                  <rect x=\"-25\" y=\"-2\" width=\"50\" height=\"4\" fill=\"none\" stroke=\"#cbd5e1\" strokeWidth=\"1\"/>\n                <\/g>\n                <text x=\"300\" y=\"170\" textAnchor=\"middle\" fill=\"#cbd5e1\" fontSize=\"10\">BS<\/text>\n                <text x=\"300\" y=\"245\" textAnchor=\"middle\" fill=\"#64748b\" fontSize=\"9\">빔스플리터<\/text>\n\n                {/* 위쪽 경로 (참조 거울) */}\n                <line x1=\"300\" y1=\"200\" x2=\"300\" y2=\"70\" stroke=\"#22d3ee\" strokeWidth=\"2\" className=\"glow-cyan\" strokeDasharray=\"4,2\">\n                  <animate attributeName=\"stroke-dashoffset\" values=\"0;-12\" dur=\"0.8s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <rect x=\"270\" y=\"40\" width=\"60\" height=\"20\" fill=\"#0f172a\" stroke=\"#22d3ee\" strokeWidth=\"2\"/>\n                <line x1=\"270\" y1=\"60\" x2=\"330\" y2=\"60\" stroke=\"#22d3ee\" strokeWidth=\"3\"/>\n                <text x=\"300\" y=\"30\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"10\" fontWeight=\"bold\">M₁ (참조)<\/text>\n\n                {/* 오른쪽 경로 (측정 거울) */}\n                <line x1=\"300\" y1=\"200\" x2=\"540\" y2=\"200\" stroke=\"#22d3ee\" strokeWidth=\"2\" className=\"glow-cyan\" strokeDasharray=\"4,2\">\n                  <animate attributeName=\"stroke-dashoffset\" values=\"0;-12\" dur=\"0.8s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <rect x=\"540\" y=\"170\" width=\"20\" height=\"60\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"2\"/>\n                <line x1=\"540\" y1=\"170\" x2=\"540\" y2=\"230\" stroke=\"#fbbf24\" strokeWidth=\"3\"/>\n                <text x=\"595\" y=\"185\" fill=\"#fbbf24\" fontSize=\"10\" fontWeight=\"bold\">M₂ (측정)<\/text>\n                <text x=\"595\" y=\"200\" fill=\"#94a3b8\" fontSize=\"9\">↔ 이동<\/text>\n                <text x=\"595\" y=\"215\" fill=\"#64748b\" fontSize=\"9\">측정 대상<\/text>\n\n                {/* 반사된 빔 (위쪽에서 돌아옴) */}\n                <line x1=\"300\" y1=\"70\" x2=\"300\" y2=\"200\" stroke=\"#a78bfa\" strokeWidth=\"1.5\" opacity=\"0.6\" strokeDasharray=\"2,2\"/>\n                <line x1=\"540\" y1=\"200\" x2=\"300\" y2=\"200\" stroke=\"#a78bfa\" strokeWidth=\"1.5\" opacity=\"0.6\" strokeDasharray=\"2,2\"/>\n\n                {/* 검출기로 가는 결합 빔 */}\n                <line x1=\"300\" y1=\"200\" x2=\"300\" y2=\"340\" stroke=\"#f472b6\" strokeWidth=\"2.5\" className=\"glow-pink\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,140;140,0\" dur=\"1.5s\" repeatCount=\"indefinite\"/>\n                <\/line>\n\n                {/* 검출기 */}\n                <rect x=\"270\" y=\"340\" width=\"60\" height=\"40\" fill=\"#0f172a\" stroke=\"#f472b6\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"300\" y=\"360\" textAnchor=\"middle\" fill=\"#f472b6\" fontSize=\"11\" fontWeight=\"bold\">검출기<\/text>\n                <text x=\"300\" y=\"373\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"9\">Photodiode<\/text>\n\n                {/* 라벨: 광로차 */}\n                <text x=\"420\" y=\"195\" fill=\"#fbbf24\" fontSize=\"11\" fontStyle=\"italic\">ΔL = L₂ − L₁<\/text>\n\n                {/* 수식 박스 */}\n                <rect x=\"450\" y=\"280\" width=\"220\" height=\"80\" fill=\"#0f172a\" stroke=\"#475569\" rx=\"6\" opacity=\"0.95\"/>\n                <text x=\"460\" y=\"300\" fill=\"#94a3b8\" fontSize=\"10\">검출 신호:<\/text>\n                <text x=\"460\" y=\"320\" fill=\"#22d3ee\" fontSize=\"13\" fontFamily=\"monospace\">I = I₀[1 + cos(2k·ΔL)]<\/text>\n                <text x=\"460\" y=\"340\" fill=\"#94a3b8\" fontSize=\"10\">위상: φ = 4π·ΔL / λ<\/text>\n                <text x=\"460\" y=\"355\" fill=\"#fbbf24\" fontSize=\"9\">→ DC 강도 변화로 측정<\/text>\n              <\/svg>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4 mt-6\">\n                <div className=\"bg-slate-950/50 border border-cyan-900/50 rounded-lg p-4\">\n                  <div className=\"text-cyan-400 text-sm font-semibold mb-2\">✓ 장점<\/div>\n                  <ul className=\"text-slate-300 text-sm space-y-1\">\n                    <li>• 구조가 단순하고 직관적<\/li>\n                    <li>• 광원이 저렴 (HeNe 등)<\/li>\n                    <li>• 교육·연구용으로 적합<\/li>\n                    <li>• LIGO 같은 극단적 정밀계측 가능<\/li>\n                  <\/ul>\n                <\/div>\n                <div className=\"bg-slate-950/50 border border-red-900/50 rounded-lg p-4\">\n                  <div className=\"text-red-400 text-sm font-semibold mb-2\">✗ 단점<\/div>\n                  <ul className=\"text-slate-300 text-sm space-y-1\">\n                    <li>• 광원 강도 변동에 직접 영향<\/li>\n                    <li>• DC 노이즈에 취약<\/li>\n                    <li>• 방향 모호성 (cos는 ±φ 동일)<\/li>\n                    <li>• 산업용 실시간 위치제어 부적합<\/li>\n                  <\/ul>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            {/* 신호 차트 */}\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h3 className=\"text-lg font-bold mb-4 text-cyan-400\">Michelson 검출 신호 (DC 강도)<\/h3>\n              <ResponsiveContainer width=\"100%\" height={220}>\n                <AreaChart data={michelsonData}>\n                  <defs>\n                    <linearGradient id=\"colorIntensity\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                      <stop offset=\"5%\" stopColor=\"#22d3ee\" stopOpacity={0.6}/>\n                      <stop offset=\"95%\" stopColor=\"#22d3ee\" stopOpacity={0}/>\n                    <\/linearGradient>\n                  <\/defs>\n                  <CartesianGrid strokeDasharray=\"3 3\" stroke=\"#1e293b\"/>\n                  <XAxis dataKey=\"x\" stroke=\"#64748b\" tick={{ fontSize: 10 }} label={{ value: '광로차 (rad)', position: 'insideBottom', offset: -5, fill: '#94a3b8' }}/>\n                  <YAxis stroke=\"#64748b\" tick={{ fontSize: 10 }} label={{ value: '강도 I/I₀', angle: -90, position: 'insideLeft', fill: '#94a3b8' }}/>\n                  <Tooltip contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '6px' }}/>\n                  <Area type=\"monotone\" dataKey=\"intensity\" stroke=\"#22d3ee\" strokeWidth={2} fill=\"url(#colorIntensity)\"/>\n                <\/AreaChart>\n              <\/ResponsiveContainer>\n              <p className=\"text-xs text-slate-500 mt-2\">광로차가 변하면 검출기는 정적인(DC) 강도 변화만 봄. λ/2 이동할 때마다 한 주기.<\/p>\n            <\/div>\n          <\/div>\n        )}\n\n        {/* Heterodyne 탭 */}\n        {activeTab === 'heterodyne' && (\n          <div className=\"space-y-6\">\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h2 className=\"text-2xl font-bold mb-1 text-amber-400\">Heterodyne 간섭계 구조<\/h2>\n              <p className=\"text-slate-400 text-sm mb-6\">두 개의 약간 다른 주파수(f₁, f₂)로 분리된 빔의 비트 신호로 위상 측정<\/p>\n\n              <svg viewBox=\"0 0 700 420\" className=\"w-full h-auto bg-slate-950 rounded-lg border border-slate-800\">\n                <defs>\n                  <pattern id=\"grid2\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\n                    <path d=\"M 20 0 L 0 0 0 20\" fill=\"none\" stroke=\"#1e293b\" strokeWidth=\"0.5\"/>\n                  <\/pattern>\n                <\/defs>\n                <rect width=\"700\" height=\"420\" fill=\"url(#grid2)\"/>\n\n                {/* 이중 주파수 광원 */}\n                <rect x=\"20\" y=\"180\" width=\"80\" height=\"50\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"60\" y=\"200\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"10\" fontWeight=\"bold\">DUAL-FREQ<\/text>\n                <text x=\"60\" y=\"215\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"10\" fontWeight=\"bold\">LASER<\/text>\n                <text x=\"60\" y=\"227\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"8\">(Zeeman/AOM)<\/text>\n                <text x=\"60\" y=\"252\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"9\">f₁ (편광 1)<\/text>\n                <text x=\"60\" y=\"265\" textAnchor=\"middle\" fill=\"#f472b6\" fontSize=\"9\">f₂ (편광 2)<\/text>\n\n                {/* 입사 빔 - 두 색상 함께 */}\n                <line x1=\"100\" y1=\"203\" x2=\"280\" y2=\"203\" stroke=\"#22d3ee\" strokeWidth=\"2\" className=\"glow-cyan\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,180;180,0\" dur=\"1.5s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <line x1=\"100\" y1=\"208\" x2=\"280\" y2=\"208\" stroke=\"#f472b6\" strokeWidth=\"2\" className=\"glow-pink\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,180;180,0\" dur=\"1.7s\" repeatCount=\"indefinite\"/>\n                <\/line>\n\n                {/* 편광 빔스플리터 (PBS) */}\n                <g transform=\"translate(290, 205) rotate(45)\">\n                  <rect x=\"-25\" y=\"-2\" width=\"50\" height=\"4\" fill=\"#fbbf24\" opacity=\"0.7\"/>\n                  <rect x=\"-25\" y=\"-2\" width=\"50\" height=\"4\" fill=\"none\" stroke=\"#fde68a\" strokeWidth=\"1\"/>\n                <\/g>\n                <text x=\"290\" y=\"172\" textAnchor=\"middle\" fill=\"#fde68a\" fontSize=\"10\">PBS<\/text>\n                <text x=\"290\" y=\"250\" textAnchor=\"middle\" fill=\"#6474 troke=\"#475569\" rx=\"6\" opacity=\"0.95\"/>\n                <text x=\"460\" y=\"80\" fill=\"#94a3b8\" fontSize=\"10\">검출 신호 (AC):<\/text>\n                <text x=\"460\" y=\"100\" fill=\"#fbbf24\" fontSize=\"12\" fontFamily=\"monospace\">I = I₀cos(2π·Δf·t + φ)<\/text>\n                <text x=\"460\" y=\"120\" fill=\"#94a3b8\" fontSize=\"10\">Δf = f₂ − f₁ (비트 주파수)<\/text>\n                <text x=\"460\" y=\"135\" fill=\"#94a3b8\" fontSize=\"10\">φ = 4π·ΔL/λ (측정 위상)<\/text>\n                <text x=\"460\" y=\"152\" fill=\"#22d3ee\" fontSize=\"9\">→ 시간 영역 위상 측정<\/text>\n              <\/svg>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4 mt-6\">\n                <div className=\"bg-slate-950/50 border border-amber-900/50 rounded-lg p-4\">\n                  <div className=\"text-amber-400 text-sm font-semibold mb-2\">✓ 장점<\/div>\n                  <ul className=\"text-slate-300 text-sm space-y-1\">\n                    <li>• DC 노이즈 면역 (AC 신호 검출)<\/li>\n                    <li>• 광원 강도 변동 영향 적음<\/li>\n                    <li>• 방향성 정보 보존 (도플러)<\/li>\n                    <li>• Sub-nm 분해능 가능 (λ/4096)<\/li>\n                    <li>• 실시간 고속 측정 적합<\/li>\n                  <\/ul>\n                <\/div>\n                <div className=\"bg-slate-950/50 border border-red-900/50 rounded-lg p-4\">\n                  <div className=\"text-red-400 text-sm font-semibold mb-2\">✗ 단점<\/div>\n                  <ul className=\"text-slate-300 text-sm space-y-1\">\n                    <li>• 시스템 복잡도 높음<\/li>\n                    <li>• Zeeman 레이저/AOM 필요 (비쌈)<\/li>\n                    <li>• 편광 광학계 정밀 정렬 필요<\/li>\n                    <li>• 비주기적 비선형 오차 존재<\/li>\n                  <\/ul>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            {/* 비트 신호 차트 */}\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h3 className=\"text-lg font-bold mb-4 text-amber-400\">Heterodyne 검출 신호 (AC 비트)<\/h3>\n              <ResponsiveContainer width=\"100%\" height={260}>\n                <LineChart data={heterodyneData}>\n                  <CartesianGrid strokeDasharray=\"3 3\" stroke=\"#1e293b\"/>\n                  <XAxis dataKey=\"t\" stroke=\"#64748b\" tick={{ fontSize: 10 }} label={{ value: '시간 (μs)', position: 'insideBottom', offset: -5, fill: '#94a3b8' }}/>\n                  <YAxis stroke=\"#64748b\" tick={{ fontSize: 10 }} domain={[-1.2, 1.2]} label={{ value: '진폭', angle: -90, position: 'insideLeft', fill: '#94a3b8' }}/>\n                  <Tooltip contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '6px' }}/>\n                  <Legend wrapperStyle={{ fontSize: '11px' }}/>\n                  <Line type=\"monotone\" dataKey=\"beam1\" stroke=\"#22d3ee\" strokeWidth={1} dot={false} name=\"f₁ 빔\" opacity={0.5}/>\n                  <Line type=\"monotone\" dataKey=\"beam2\" stroke=\"#f472b6\" strokeWidth={1} dot={false} name=\"f₂ 빔 (+도플러)\" opacity={0.5}/>\n                  <Line type=\"monotone\" dataKey=\"detected\" stroke=\"#fbbf24\" strokeWidth={2.5} dot={false} name=\"검출된 비트 신호 (Δf)\"/>\n                <\/LineChart>\n              <\/ResponsiveContainer>\n              <p className=\"text-xs text-slate-500 mt-2\">두 주파수의 합쳐진 신호는 비트 주파수(Δf)로 진동하며, 이 AC 신호의 <span className=\"text-amber-400\">위상<\/span>이 측정 거리를 직접 나타냄.<\/p>\n            <\/div>\n          <\/div>\n        )}\n\n        {/* 비교 탭 */}\n        {activeTab === 'compare' && (\n          <div className=\"space-y-6\">\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h2 className=\"text-2xl font-bold mb-6 text-pink-400\">상세 비교표<\/h2>\n              <div className=\"overflow-x-auto\">\n                <table className=\"w-full\">\n                  <thead>\n                    <tr className=\"border-b border-slate-700\">\n                      <th className=\"text-left py-3 px-2 text-slate-400 text-xs tracking-wider font-medium\">구분<\/th>\n                      <th className=\"text-left py-3 px-2 text-cyan-400 text-xs tracking-wider font-medium\">Michelson<\/th>\n                      <th className=\"text-left py-3 px-2 text-amber-400 text-xs tracking-wider font-medium\">Heterodyne<\/th>\n                    <\/tr>\n                  <\/thead>\n                  <tbody>\n                    {comparisonRows.map((row, idx) => (\n                      <tr key={idx} className=\"border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors\">\n                        <td className=\"py-3 px-2 text-slate-200 font-medium\">\n                          <span className=\"mr-2\">{row.icon}<\/span>{row.feature}\n                        <\/td>\n                        <td className=\"py-3 px-2 text-slate-300 text-sm\">{row.michelson}<\/td>\n                        <td className=\"py-3 px-2 text-slate-300 text-sm\">{row.heterodyne}<\/td>\n                      <\/tr>\n                    ))}\n                  <\/tbody>\n                <\/table>\n              <\/div>\n            <\/div>\n\n            {/* 신호 비교 시각화 */}\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h3 className=\"text-lg font-bold mb-4 text-pink-400\">📊 검출 신호 형태 비교<\/h3>\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n                <div>\n                  <div className=\"text-cyan-400 text-sm font-semibold mb-2\">Michelson: DC 강도<\/div>\n                  <svg viewBox=\"0 0 300 120\" className=\"w-full bg-slate-950 rounded\">\n                    <path d={`M 0 60 ${Array.from({length: 100}, (_, i) => {\n                      const x = i * 3;\n                      const y = 60 - 40 * Math.cos(i * 0.2 + time);\n                      return `L ${x} ${y}`;\n                    }).join(' ')}`} stroke=\"#22d3ee\" strokeWidth=\"2\" fill=\"none\" className=\"glow-cyan\"/>\n                    <line x1=\"0\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"#475569\" strokeWidth=\"0.5\" strokeDasharray=\"2,2\"/>\n                    <text x=\"10\" y=\"115\" fill=\"#64748b\" fontSize=\"10\">→ 시간 (광로차 변화시 강도 변동)<\/text>\n                  <\/svg>\n                  <p className=\"text-xs text-slate-500 mt-2\">광로차 측정 = 강도→위상 역산 (모호함 존재)<\/p>\n                <\/div>\n                <div>\n                  <div className=\"text-amber-400 text-sm font-semibold mb-2\">Heterodyne: AC 비트<\/div>\n                  <svg viewBox=\"0 0 300 120\" className=\"w-full bg-slate-950 rounded\">\n                    <path d={`M 0 60 ${Array.from({length: 100}, (_, i) => {\n                      const x = i * 3;\n                      const y = 60 - 40 * Math.cos(i * 0.5 + time + phaseShift);\n                      return `L ${x} ${y}`;\n                    }).join(' ')}`} stroke=\"#fbbf24\" strokeWidth=\"2\" fill=\"none\" className=\"glow-amber\"/>\n                    <line x1=\"0\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"#475569\" strokeWidth=\"0.5\" strokeDasharray=\"2,2\"/>\n                    <text x=\"10\" y=\"115\" fill=\"#64748b\" fontSize=\"10\">→ 시간 (Δf로 항상 진동, 위상이 위치)<\/text>\n                  <\/svg>\n                  <p className=\"text-xs text-slate-500 mt-2\">위상 측정 = 시간차 직접 측정 (정확, 노이즈 면역)<\/p>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            {/* ASML 응용 */}\n            <div className=\"bg-gradient-to-br from-slate-900/80 to-slate-900/40 border border-amber-800/40 rounded-xl p-6\">\n              <div className=\"flex items-center gap-3 mb-4\">\n                <div className=\"text-3xl\">🏭<\/div>\n                <div>\n                  <h3 className=\"text-xl font-bold text-amber-400\">ASML 노광장비에서의 응용<\/h3>\n                  <p className=\"text-xs text-slate-400\">영민님의 현장 컨텍스트 — TWINSCAN NXE 시리즈 기준<\/p>\n                <\/div>\n              <\/div>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4 mt-4\">\n                <div className=\"bg-slate-950/60 border border-slate-800 rounded-lg p-4\">\n                  <div className=\"text-amber-400 text-sm font-semibold mb-2\">왜 Heterodyne가 표준인가<\/div>\n                  <ul className=\"text-slate-300 text-xs space-y-1.5\">\n                    <li>• 웨이퍼 스테이지가 1 m/s 이상 고속 이동 → 도플러 시프트 자연스럽게 활용<\/li>\n                    <li>• Sub-nm 위치 정확도 요구 (overlay {'<'} 1 nm)<\/li>\n                    <li>• EUV 챔버 진공·진동 환경에서 강도 노이즈 면역 필수<\/li>\n                    <li>• 다축 동시 측정 (6-DOF) 시 위상 락 안정성 우수<\/li>\n                    <li>• Agilent/Zygo/Renishaw 시스템 모두 Heterodyne 기반<\/li>\n                  <\/ul>\n                <\/div>\n                <div className=\"bg-slate-950/60 border border-slate-800 rounded-lg p-4\">\n                  <div className=\"text-cyan-400 text-sm font-semibold mb-2\">Michelson은 어디에?<\/div>\n                  <ul className=\"text-slate-300 text-xs space-y-1.5\">\n                    <li>• 광학 부품 표면 평탄도 검사 (Fizeau 변형)<\/li>\n                    <li>• 미러/렌즈 품질 측정 (정적 측정)<\/li>\n                    <li>• 연구실 광학 정렬 확인<\/li>\n                    <li>• White-light interferometry (저coherence)<\/li>\n                    <li>• → 실시간 산업 계측엔 부적합<\/li>\n                  <\/ul>\n                <\/div>\n              <\/div>\n\n              <div className=\"mt-4 p-4 bg-amber-950/20 border-l-4 border-amber-500 rounded\">\n                <div className=\"text-amber-400 text-sm font-semibold mb-1\">💡 현장 인사이트<\/div>\n                <p className=\"text-slate-300 text-xs leading-relaxed\">\n                  ASML TWINSCAN의 웨이퍼 스테이지 위치는 Zeeman-split HeNe (~3 MHz 비트 주파수) 기반 다축 heterodyne 간섭계로 측정됩니다. \n                  최근 일부 시스템은 공기 굴절률 변동 보정을 위해 진공 빔파이프 또는 grating-based encoder (IPRO/ATHENA)와 하이브리드로 운영되는 추세입니다. \n                  Heterodyne의 한계인 비선형 오차(periodic error)는 PBS 누설로 발생하며, 일반적으로 λ/512 ~ λ/2048 수준입니다.\n                <\/p>\n              <\/div>\n            <\/div>\n          <\/div>\n        )}\n\n        {/* 푸터 */}\n        <foote ices + Adyen 9-step', detail: 'TSM: yfinance → DCF → 메모', time: '2시간' },\n    { day: '목', task: 'Korean MCP + 학원 routine', detail: 'zeikar/kimcp + 매일 8시 트렌드', time: '1.5시간' },\n    { day: '금', task: 'Prompt caching 검증', detail: 'LangGraph + Haiku 70% 라우팅', time: '1시간' },\n    { day: '토', task: 'Boris 5-tab 병렬', detail: '5개 git checkout + iTerm2 알림', time: '2시간' },\n  ];\n\n  const tabs = [\n    { id: 'overview', name: '개요', icon: Sparkles },\n    { id: 'models', name: '모델', icon: Brain },\n    { id: 'features', name: '핵심 기능', icon: Zap },\n    { id: 'matrix', name: 'Hype × 검증', icon: Target },\n    { id: 'persona', name: '페르소나', icon: Users },\n    { id: 'security', name: '보안', icon: Shield },\n    { id: 'action', name: '실행 계획', icon: Rocket },\n  ];\n\n  return (\n    <div className=\"min-h-screen bg-zinc-950 text-zinc-100\" style={{ fontFamily: '\"Pretendard\", \"Noto Sans KR\", -apple-system, sans-serif' }}>\n      <div className=\"border-b border-zinc-800 bg-gradient-to-br from-zinc-900 via-zinc-950 to-zinc-900\">\n        <div className=\"max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10\">\n          <div className=\"flex items-center gap-2 text-xs text-zinc-500 mb-3\">\n            <span className=\"px-2 py-0.5 rounded-full bg-zinc-800 border border-zinc-700\">REPORT · 2026-05-04<\/span>\n            <span className=\"hidden sm:inline\">함영민님 맞춤 전략 보고서<\/span>\n          <\/div>\n          <h1 className=\"text-3xl sm:text-5xl font-bold tracking-tight bg-gradient-to-r from-violet-300 via-indigo-300 to-cyan-300 bg-clip-text text-transparent leading-tight\">\n            Claude 생산성 트렌드 2026\n          <\/h1>\n          <p className=\"text-sm sm:text-base text-zinc-400 mt-3 max-w-3xl\">\n            2025년 말 ~ 2026년 5월의 검증된 패턴, 떠오르는 트렌드, Hype 함정을 균형있게.\n          <\/p>\n          <div className=\"flex flex-wrap gap-2 mt-5\">\n            <span className=\"px-3 py-1 rounded-full text-xs bg-violet-950/50 border border-violet-800/50 text-violet-300\">Claude Code<\/span>\n me=\"text-zinc-500 mx-2\">→<\/span>\n                      <span className=\"text-cyan-300\">{r.action}<\/span>\n                    <\/div>\n                  <\/div>\n                ))}\n              <\/div>\n            <\/div>\n\n            <div className=\"rounded-xl bg-gradient-to-br from-emerald-950/30 to-teal-950/30 border border-emerald-800/30 p-4 sm:p-6\">\n              <h3 className=\"font-bold mb-2 text-emerald-100\">💡 영민님의 LangGraph 자산 활용<\/h3>\n              <p className=\"text-sm text-zinc-300 leading-relaxed\">\n                이미 LangGraph 사용 중이시라면, Claude Agent SDK의 query()가 LangGraph의 StateGraph와 \n                <span className=\"text-emerald-300 font-medium\"> 보완 관계<\/span>입니다.\n              <\/p>\n              <div className=\"grid sm:grid-cols-2 gap-3 mt-4\">\n                <div className=\"bg-zinc-900/50 rounded-lg p-3\">\n                  <p className=\"text-xs text-emerald-400 font-medium mb-1\">LangGraph 우월<\/p>\n                  <p className=\"text-xs text-zinc-300\">단계 정해진 워크플로 — 데이터 → DCF → 시나리오 → 메모<\/p>\n                <\/div>\n                <div className=\"bg-zinc-900/50 rounded-lg p-3\">\n                  <p className=\"text-xs text-cyan-400 font-medium mb-1\">Agent SDK 우월<\/p>\n                  <p className=\"text-xs text-zinc-300\">탐색적 리서치 — breadth-first 분기 답변<\/p>\n                <\/div>\n              <\/div>\n              <p className=\"text-sm text-emerald-200 mt-4 font-medium\">\n                결론: LangGraph는 버리지 마세요. Skills로 Claude Code 안에서 LangGraph 호출하는 hybrid가 2026 표준.\n              <\/p>\n            <\/div>\n\n            <div className=\"rounded-xl bg-zinc-900/30 border border-zinc-800 p-4 sm:p-6\">\n              <h3 className=\"font-bold mb-2 flex items-center gap-2 text-zinc-300\">\n                <Eye size={16} /> 정직한 한계 (Caveats)\n              <\/h3>\n              <div className=\"space-y-1.5 text-xs text-zinc-500\">\n                {[\n                  '시점: 2026-05-04 기준. Anthropic은 2-3주마다 새 기능 출시',\n                  'Skills 2.0 측정은 Anthropic 자체 — 50% discount 권장',\n                  'CodeRabbit 470 PR 분석은 트렌드 방향성으로만',\n                  'Multi-agent 90.2%는 research eval 한정',\n                  '한국 enterprise 공식: SK Telecom, Law&Company만 명명',\n                  '가격은 모델 업데이트마다 변동',\n                ].map((c, i) => (\n                  <div key={i} className=\"flex gap-2\">\n                    <span className=\"text-zinc-700\">·<\/span>\n                    <span>{c}<\/span>\n                  <\/div>\n                ))}\n              <\/div>\n            <\/div>\n          <\/div>\n        )}\n\n        <div className=\"mt-12 pt-6 border-t border-zinc-800 text-center text-xs text-zinc-600\">\n          <p>함영민님 맞춤 전략 보고서 · 2026-05-04 작성<\/p>\n          <p className=\"mt-1\">Sources: Anthropic Engineering Blog · Bloomberg · CodeRabbit · OX Security · KED Global<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction KPICard({ icon: Icon, label, value, sub, color }) {\n  const colors = {\n    emerald: 'from-emerald-950/40 to-emerald-900/20 border-emerald-800/30',\n    violet: 'from-violet-950/40 to-violet-900/20 border-violet-800/30',\n    cyan: 'from-cyan-950/40 to-cyan-900/20 border-cyan-800/30',\n    amber: 'from-amber-950/40 to-amber-900/20 border-amber-800/30',\n  };\n  const iconColors = {\n    emerald: 'text-emerald-400',\n    violet: 'text-violet-400',\n    cyan: 'text-cyan-400',\n    amber: 'text-amber-400',\n  };\n  return (\n    <div className={`rounded-xl bg-gradient-to-br ${colors[color]} border p-3 sm:p-4`}>\n      <div className=\"flex items-center gap-2 mb-2\">\n        <Icon size={14} className={iconColors[color]} />\n        <span className=\"text-xs text-zinc-500\">{label}<\/span>\n      <\/div>\n      <p className=\"text-xl sm:text-2xl font-bold text-zinc-100\">{value}<\/p>\n      <p className=\"text-xs text-zinc-500 mt-1\">{sub}<\/p>\n    <\/div>\n  );\n}\n\nfunction InsightCard({ icon: Icon, color, title, items }) {\n  const colors = {\n    emerald: 'bg-emerald-950/20 border-emerald-800/30 text-emerald-300',\n    rose: 'bg-rose-950/20 border-rose-800/30 text-rose-300',\n  };\n  return (\n    <div className={`rounded-xl border p-4 sm:p-5 ${colors[color]}`}>\n      <div className=\"flex items-center gap-2 mb-3\">\n        <Icon size={18} />\n        <h3 className=\"font-semibold\">{title}<\/h3>\n      <\/div>\n      <ul className=\"space-y-2\">\n        {items.map((item, i) => (\n          <li key={i} className=\"text-sm text-zinc-300 flex gap-2\">\n            <span className=\"text-zinc-500 shrink-0\">{i + 1}.<\/span>\n            <span>{item}<\/span>\n          <\/li>\n        ))}\n      <\/ul>\n    <\/div>\n  );\n}\n","mindmap_GratingEncoderDeepDive.jsx":"import React, { useState, useEffect } from 'react';\nimport { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, Cell, RadarChart, Radar, PolarGrid, PolarAngleAxis, PolarRadiusAxis } from 'recharts';\n\nexport default function GratingEncoderDeepDive() {\n  const [activeSection, setActiveSection] = useState('principle');\n  const [stagePos, setStagePos] = useState(0);\n  const [animTime, setAnimTime] = useState(0);\n\n  useEffect(() => {\n    const interval = setInterval(() => {\n      setAnimTime(t => t + 0.05);\n    }, 30);\n    return () => clearInterval(interval);\n  }, []);\n\n  // 회절 격자에서 위상 시프트 데이터\n  const generatePhaseShiftData = () => {\n    const data = [];\n    const gratingPeriod = 1000; // nm\n    for (let displacement = 0; displacement <= 4000; displacement += 20) {\n      // ±1차 회절광의 위상차 = 4π * x / Λ\n      const phaseDiff = (4 * Math.PI * displacement) / gratingPeriod;\n      const signal = Math.cos(phaseDiff);\n      data.push({\n        x: displacement,\n        signal: signal,\n        phase: (phaseDiff / Math.PI).toFixed(2),\n      });\n    }\n    return data;\n  };\n\n  // 환경 민감도 비교\n  const sensitivityData = [\n    { name: '온도\\n(1°C 변화)', laser: 950, grating: 12, unit: 'pm' },\n    { name: '습도\\n(10% RH)', laser: 380, grating: 5, unit: 'pm' },\n    { name: '압력\\n(1 hPa)', laser: 270, grating: 3, unit: 'pm' },\n    { name: '광원 주파수\\n변동 (Δν/ν)', laser: 200, grating: 8, unit: 'pm' },\n  ];\n\n  // 오차 원인 분석\n  const errorBudget = [\n    { name: '주기적 비선형', value: 30, color: '#ef4444', desc: 'PBS 편광 누설' },\n    { name: 'Abbe 오차', value: 50, color: '#f97316', desc: '회전-병진 결합' },\n    { name: '격자 제조오차', value: 80, color: '#eab308', desc: '피치 변동' },\n    { name: '온도 드리프트', value: 40, color: '#3b82f6', desc: '광학계 열팽창' },\n    { name: '신호 보간', value: 25, color: '#8b5cf6', desc: 'AD 변환 비선형' },\n    { name: '기타', value: 15, color: '#64748b', desc: '기계적 진동' },\n  ];\n\n  // 6-DOF 측정 데이터\n  const dof6Data = [\n    { dof: 'X', range: '300mm', resolution: 0.22, headCount: 2 },\n    { dof: 'Y', range: '300mm', resolution: 0.22, headCount: 2 },\n    { dof: 'Z', range: '300μm', resolution: 0.5, headCount: 4 },\n    { dof: 'Rx', range: '±1.5mrad', resolution: 0.05, headCount: 4 },\n    { dof: 'Ry', range: '±1.5mrad', resolution: 0.05, headCount: 4 },\n    { dof: 'Rz', range: '±1.5mrad', resolution: 0.03, headCount: 4 },\n  ];\n\n  // 레이더 차트 (기술 특성 비교)\n  const radarData = [\n    { metric: '환경 강인성', laser: 30, grating: 95 },\n    { metric: '분해능', laser: 70, grating: 95 },\n    { metric: '측정 속도', laser: 80, grating: 90 },\n    { metric: '컴팩트성', laser: 30, grating: 85 },\n    { metric: '비용효율', laser: 25, grating: 70 },\n    { metric: 'Long-stroke', laser: 95, grating: 80 },\n    { metric: '다축 통합', laser: 50, grating: 95 },\n  ];\n\n  const phaseData = generatePhaseShiftData();\n\n  return (\n    <div className=\"min-h-screen bg-slate-950 text-slate-100 p-6\" style={{ fontFamily: \"'Pretendard', 'Noto Sans KR', system-ui, sans-serif\" }}>\n      <style>{`\n        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n        .glow-amber { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.5)); }\n        .glow-cyan { filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.5)); }\n        .glow-pink { filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.5)); }\n        .glow-green { filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.5)); }\n        .glow-violet { filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.5)); }\n      `}<\/style>\n\n      <div className=\"max-w-7xl mx-auto\">\n        {/* 헤더 */}\n        <header className=\"mb-8 border-l-4 border-amber-400 pl-6\">\n          <div className=\"text-xs tracking-[0.3em] text-amber-400 mb-2\">DEEP TECHNICAL ANALYSIS · 격자 인코더 심층분석<\/div>\n          <h1 className=\"text-4xl md:text-5xl font-bold mb-3 tracking-tight\">\n            Heterodyne <span className=\"text-amber-400\">Grating Encoder<\/span>\n          <\/h1>\n          <p className=\"text-slate-400 text-lg\">ASML 노광기 웨이퍼 스테이지의 심장 · 광학 원리부터 트러블슈팅까지<\/p>\n        <\/header>\n\n        {/* 핵심 사양 카드 */}\n        <div className=\"grid grid-cols-2 md:grid-cols-5 gap-3 mb-8\">\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-4\">\n            <div className=\"text-xs text-slate-500 mb-1\">분해능 (3σ)<\/div>\n            <div className=\"text-2xl font-bold text-amber-400\">0.22 <span className=\"text-sm text-slate-400\">nm<\/span><\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-4\">\n            <div className=\"text-xs text-slate-500 mb-1\">광로 길이<\/div>\n            <div className=\"text-2xl font-bold text-cyan-400\">~15 <span className=\"text-sm text-slate-400\">mm<\/span><\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-4\">\n            <div className=\"text-xs text-slate-500 mb-1\">측정 갱신율<\/div>\n            <div className=\"text-2xl font-bold text-pink-400\">20 <span className=\"text-sm text-slate-400\">kHz<\/span><\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-4\">\n            <div className=\"text-xs text-slate-500 mb-1\">측정 자유도<\/div>\n            <div className=\"text-2xl font-bold text-green-400\">6 <span className=\"text-sm text-slate-400\">DOF<\/span><\/div>\n          <\/div>\n          <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-4\">\n            <div className=\"text-xs text-slate-500 mb-1\">격자 피치<\/div>\n            <div className=\"text-2xl font-bold text-violet-400\">0.5~1 <span className=\"text-sm text-slate-400\">μm<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        {/* 네비게이션 */}\n        <div className=\"flex flex-wrap gap-2 mb-6 border-b border-slate-800\">\n          {[\n            { id: 'principle', label: '01 · 회절 원리', color: '#fbbf24' },\n            { id: 'optics', label: '02 · 광학 구조', color: '#22d3ee' },\n            { id: '6dof', label: '03 · 6-DOF 측정', color: '#a78bfa' },\n            { id: 'errors', label: '04 · 오차원인', color: '#ef4444' },\n            { id: 'asml', label: '05 · ASML 구현', color: '#f472b6' },\n            { id: 'field', label: '06 · 현장 트러블슈팅', color: '#4ade80' },\n          ].map(tab => (\n            <button\n              key={tab.id}\n              onClick={() => setActiveSection(tab.id)}\n              className=\"px-4 py-3 text-sm font-medium tracking-wide transition-all\"\n              style={{\n                color: activeSection === tab.id ? tab.color : '#64748b',\n                borderBottom: activeSection === tab.id ? `2px solid ${tab.color}` : '2px solid transparent',\n              }}\n            >\n              {tab.label}\n            <\/button>\n          ))}\n        <\/div>\n\n        {/* 섹션 1: 회절 원리 */}\n        {activeSection === 'principle' && (\n          <div className=\"space-y-6\">\n            <div className=\"bg-gradient-to-br from-amber-950/30 to-slate-900/60 border border-amber-800/40 rounded-xl p-6\">\n              <h2 className=\"text-2xl font-bold mb-3 text-amber-400\">🔬 핵심 원리: 격자가 빛을 회절시키면 위치 정보가 위상에 새겨진다<\/h2>\n              <p className=\"text-slate-300 leading-relaxed mb-4\">\n                레이저 간섭계는 <span className=\"text-cyan-400 font-semibold\">파장(λ)<\/span>을 길이의 기준으로 삼지만,\n                격자 인코더는 <span className=\"text-amber-400 font-semibold\">격자 피치(Λ)<\/span>를 길이의 기준으로 삼습니다.\n                이 한 가지 차이가 모든 것을 바꿉니다.\n              <\/p>\n              <div className=\"bg-slate-950/80 rounded-lg p-5 font-mono text-sm leading-relaxed\">\n                <div className=\"text-slate-500 mb-2\">회절 방정식 (격자 방정식):<\/div>\n                <div className=\"text-amber-300 text-lg mb-3\">Λ · (sin θᵢ + sin θₘ) = m · λ<\/div>\n                <div className=\"text-slate-500 mb-2\">격자가 x만큼 이동하면 m차 회절광의 위상은:<\/div>\n                <div className=\"text-amber-300 text-lg mb-3\">Δφₘ = 2π · m · x / Λ<\/div>\n                <div className=\"text-slate-500 mb-2\">±1차 회절광을 간섭시키면 (m=+1, m=-1):<\/div>\n                <div className=\"text-pink-300 text-lg\">Δφ = 4π · x / Λ <span className=\"text-slate-500 text-sm\">← 한 주기 = Λ/2<\/span><\/div>\n              <\/div>\n            <\/div>\n\n            {/* 회절 시각화 */}\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h3 className=\"text-xl font-bold mb-4 text-amber-400\">📐 회절 격자에서 일어나는 일<\/h3>\n              <p className=\"text-sm text-slate-400 mb-4\">아래 슬라이더로 격자를 움직여 보세요. ±1차 회절광의 위상이 변하면서 비트 신호가 시프트됩니다.<\/p>\n\n              <div className=\"mb-4\">\n                <div className=\"flex items-center justify-between mb-2\">\n                  <span className=\"text-sm text-slate-400\">격자 위치 (스테이지 이동):<\/span>\n                  <span className=\"text-amber-400 font-mono\">{stagePos} nm (= {(stagePos / 500).toFixed(2)} × Λ/2)<\/span>\n                <\/div>\n                <input\n                  type=\"range\"\n                  min=\"0\"\n                  max=\"2000\"\n                  step=\"10\"\n                  value={stagePos}\n                  onChange={(e) => setStagePos(Number(e.target.value))}\n                  className=\"w-full accent-amber-400\"\n                />\n              <\/div>\n\n              <svg viewBox=\"0 0 800 380\" className=\"w-full bg-slate-950 rounded-lg border border-slate-800\">\n                {/* 입사빔 */}\n                <line x1=\"400\" y1=\"30\" x2=\"400\" y2=\"220\" stroke=\"#22d3ee\" strokeWidth=\"3\" className=\"glow-cyan\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,200;200,0\" dur=\"1s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <polygon points=\"400,220 395,213 405,213\" fill=\"#22d3ee\"/>\n                <text x=\"410\" y=\"120\" fill=\"#22d3ee\" fontSize=\"12\" fontWeight=\"bold\">입사빔<\/text>\n                <text x=\"410\" y=\"135\" fill=\"#94a3b8\" fontSize=\"10\">(f₁, f₂ 두 주파수)<\/text>\n\n                {/* 격자 */}\n                <g transform={`translate(${stagePos * 0.06}, 0)`}>\n                  <rect x=\"200\" y=\"220\" width=\"400\" height=\"30\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"2\"/>\n                  {Array.from({length: 40}, (_, i) => (\n                    <rect key={i} x={200 + i * 10} y=\"220\" width=\"5\" height=\"30\" fill=\"#fbbf24\" opacity=\"0.7\"/>\n                  ))}\n                <\/g>\n                <text x=\"400\" y=\"275\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"11\" fontWeight=\"bold\">2D 회절 격자 (Λ = 1 μm)<\/text>\n                <text x=\"400\" y=\"290\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"10\">웨이퍼 스테이지에 부착<\/text>\n\n                {/* +1차 회절 */}\n                <line x1=\"400\" y1=\"220\" x2=\"220\" y2=\"30\" stroke=\"#f472b6\" strokeWidth=\"2.5\" className=\"glow-pink\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,250;250,0\" dur=\"1.2s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <text x=\"240\" y=\"100\" fill=\"#f472b6\" fontSize=\"11\" fontWeight=\"bold\">+1차 회절<\/text>\n                <text x=\"240\" y=\"115\" fill=\"#94a3b8\" fontSize=\"10\">위상: +2πx/Λ<\/text>\n\n                {/* -1차 회절 */}\n                <line x1=\"400\" y1=\"220\" x2=\"580\" y2=\"30\" stroke=\"#a78bfa\" strokeWidth=\"2.5\" className=\"glow-violet\">\n                  <animate attributeName=\"stroke-dasharray\" values=\"0,250;250,0\" dur=\"1.2s\" repeatCount=\"indefinite\"/>\n                <\/line>\n                <text x=\"560\" y=\"100\" fill=\"#a78bfa\" fontSize=\"11\" fontWeight=\"bold\">-1차 회절<\/text>\n                <text x=\"560\" y=\"115\" fill=\"#94a3b8\" fontSize=\"10\">위상: -2πx/Λ<\/text>\n\n                {/* 회절 각도 표시 */}\n                <path d=\"M 400 200 A 20 20 0 0 0 380 195\" fill=\"none\" stroke=\"#64748b\" strokeWidth=\"1\"/>\n                <text x=\"370\" y=\"210\" fill=\"#64748b\" fontSize=\"9\">θ<\/text>\n\n                {/* 위상차 박스 */}\n                <rect x=\"50\" y=\"300\" width=\"700\" height=\"70\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"1\" rx=\"6\"/>\n                <text x=\"70\" y=\"320\" fill=\"#fbbf24\" fontSize=\"12\" fontWeight=\"bold\">±1차 회절광 사이의 위상차:<\/text>\n                <text x=\"70\" y=\"342\" fill=\"#22d3ee\" fontSize=\"14\" fontFamily=\"monospace\">Δφ = 4π · x / Λ<\/text>\n                <text x=\"350\" y=\"342\" fill=\"#94a3b8\" fontSize=\"11\">\n                  현재 위치 x = {stagePos} nm → Δφ = {((4 * Math.PI * stagePos) / 1000 / Math.PI).toFixed(3)}π\n                <\/text>\n                <text x=\"70\" y=\"360\" fill=\"#64748b\" fontSize=\"10\">한 주기(2π)당 격자 이동 = Λ/2 = 500 nm (광학적 분할로 sub-nm 분해)<\/text>\n              <\/svg>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4 mt-4\">\n                <div className=\"bg-slate-950/60 rounded-lg p-4\">\n                  <div className=\"text-amber-400 font-semibold mb-2 text-sm\">왜 ±1차를 쓰는가?<\/div>\n                  <p className=\"text-xs text-slate-400\">+1차와 -1차는 격자 이동에 대해 정반대 위상 변화를 보입니다. 두 빔을 간섭시키면 위상차가 2배가 되어 분해능이 두 배가 됩니다 (광학적 doubling).<\/p>\n                <\/div>\n                <div className=\"bg-slate-950/60 rounded-lg p-4\">\n                  <div className=\"text-cyan-400 font-semibold mb-2 text-sm\">파장 vs 피치, 무엇이 기준?<\/div>\n                  <p className=\"text-xs text-slate-400\">레이저 간섭계: λ (공기 굴절률에 따라 변동). 격자 인코더: Λ (격자 자체에 새겨진 물리적 길이, 굴절률 무관). 굴절률 변화에 둔감한 본질적 이유.<\/p>\n                <\/div>\n                <div className=\"bg-slate-950/60 rounded-lg p-4\">\n                  <div className=\"text-pink-400 font-semibold mb-2 text-sm\">광학적 분할 (Optical Subdivision)<\/div>\n                  <p className=\"text-xs text-slate-400\">기본은 Λ/2 = 500 nm 분해이지만, 더블 회절(이중 회절), 4-pass 구조, ±5차 회절 활용 등으로 Λ/4, Λ/8, Λ/20까지 분해능 향상 가능.<\/p>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            {/* 위상 신호 차트 */}\n            <div className=\"bg-slate-900/60 border border-slate-800 rounded-xl p-6\">\n              <h3 className=\"text-xl font-bold mb-4 text-pink-400\">📊 격자 이동에 따른 검출 신호<\/h3>\n              <ResponsiveContainer width=\"100%\" height={240}>\n                <LineChart data={phaseData}>\n                  <CartesianGrid strokeDasharray=\"3 3\" stroke=\"#1e293b\"/>\n                  <XAxis dataKey=\"x\" stroke=\"#64748b\" tick={{ fontSize: 10 }} label={{ value: '격자 이동 거리 (nm)', position: 'insideBottom', offset: -5, fill: '#94a3b8' }}/>\n                  <YAxis stroke=\"#64748b\" tick={{ fontSize: 10 }} domain={[-1.2, 1.2]} label={{ value: '신호', angle: -90, position: 'insideLeft', fill: '#94a3b8' }}/>\n                  <Tooltip contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #334155' }}/>\n                  <Line type=\"monotone\" dataKey=\"signal\" stroke=\"#fbbf24\" strokeWidth={2} dot={false}/>\n                <\/LineChart>\n              <\/ResponsiveContainer>\n              <p className=\"text-xs text-slate-500 mt-2\">한 주기 = Λ/2 = 500 nm. 정수 주기 카운팅 + 위상 보간(interpolation)으로 sub-nm 분해능 달성.<\/p>\n            <\/div>\n          <\/div>\n        )}\n\n        {/* 섹션 2: 광학 구조 */}\n        {activeSection === 'optics' && (\n          <div className=\"space-y-6\">\n            <div className=\"bg-slate-900/60 border border-cyan-800/40 rounded-xl p-6\">\n              <h2 className=\"text-2xl font-bold mb-3 text-cyan-400\">⚙️ Encoder Head 내부 광학계<\/h2>\n              <p className=\"text-slate-300 mb-4\">\n                Encoder Head는 광원에서 온 두 주파수 빔(f₁, f₂)을 격자에 입사시키고, 회절된 빔을 다시 받아 간섭시킨 뒤 신호를 검출하는 모든 광학 처리를 수행합니다.\n                ASML이 사용하는 spatially separated heterodyne 방식을 중심으로 설명드립니다.\n              <\/p>\n\n              <svg viewBox=\"0 0 800 500\" className=\"w-full bg-slate-950 rounded-lg border border-slate-800\">\n                {/* Encoder Head Box */}\n                <rect x=\"100\" y=\"40\" width=\"600\" height=\"280\" fill=\"#0f172a\" stroke=\"#22d3ee\" strokeWidth=\"2\" strokeDasharray=\"5,3\" rx=\"6\"/>\n                <text x=\"400\" y=\"30\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"13\" fontWeight=\"bold\">Encoder Head (고정, 진공 vessel 외부)<\/text>\n\n                {/* 광섬유 입력 */}\n                <rect x=\"20\" y=\"100\" width=\"60\" height=\"30\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"2\" rx=\"3\"/>\n                <text x=\"50\" y=\"118\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"9\" fontWeight=\"bold\">Fiber In<\/text>\n                <text x=\"50\" y=\"148\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"8\">f₁, f₂<\/text>\n                <line x1=\"80\" y1=\"115\" x2=\"130\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"2\" className=\"glow-amber\"/>\n\n                {/* PBS 1 */}\n                <g transform=\"translate(150, 115) rotate(45)\">\n                  <rect x=\"-15\" y=\"-2\" width=\"30\" height=\"4\" fill=\"#94a3b8\"/>\n                <\/g>\n                <text x=\"150\" y=\"98\" textAnchor=\"middle\" fill=\"#cbd5e1\" fontSize=\"9\">PBS<\/text>\n                <text x=\"150\" y=\"160\" textAnchor=\"middle\" fill=\"#64748b\" fontSize=\"8\">편광 분리<\/text>\n\n                {/* 입사빔 → 격자 */}\n                <line x1=\"150\" y1=\"115\" x2=\"150\" y2=\"380\" stroke=\"#22d3ee\" strokeWidth=\"2\" className=\"glow-cyan\"/>\n                <text x=\"125\" y=\"250\" fill=\"#22d3ee\" fontSize=\"9\">f₁ ↓<\/text>\n                \n                {/* f₂ 경로 */}\n                <line x1=\"150\" y1=\"115\" x2=\"350\" y2=\"115\" stroke=\"#f472b6\" strokeWidth=\"2\" className=\"glow-pink\"/>\n                <line x1=\"350\" y1=\"115\" x2=\"350\" y2=\"380\" stroke=\"#f472b6\" strokeWidth=\"2\" className=\"glow-pink\"/>\n                <text x=\"240\" y=\"108\" fill=\"#f472b6\" fontSize=\"9\">f₂ →<\/text>\n\n                {/* 격자 (밖) */}\n                <rect x=\"120\" y=\"380\" width=\"280\" height=\"30\" fill=\"#0f172a\" stroke=\"#fbbf24\" strokeWidth=\"2\"/>\n                {Array.from({length: 28}, (_, i) => (\n                  <rect key={i} x={120 + i * 10} y=\"380\" width=\"5\" height=\"30\" fill=\"#fbbf24\" opacity=\"0.7\"/>\n                ))}\n                <text x=\"260\" y=\"435\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"11\" fontWeight=\"bold\">2D Diffraction Grating<\/text>\n                <text x=\"260\" y=\"448\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"9\">웨이퍼 스테이지에 부착 · Λ ≈ 1 μm<\/text>\n\n                {/* 회절광 반환 (입사 빔과 분리됨) */}\n                <line x1=\"150\" y1=\"380\" x2=\"200\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"1.5\" strokeDasharray=\"3,2\" opacity=\"0.8\"/>\n                <line x1=\"350\" y1=\"380\" x2=\"280\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"1.5\" strokeDasharray=\"3,2\" opacity=\"0.8\"/>\n\n                {/* QWP 1 & QWP 2 */}\n                <rect x=\"195\" y=\"200\" width=\"10\" height=\"40\" fill=\"#a78bfa\" opacity=\"0.6\"/>\n                <text x=\"200\" y=\"195\" textAnchor=\"middle\" fill=\"#a78bfa\" fontSize=\"8\">QWP<\/text>\n                <rect x=\"345\" y=\"200\" width=\"10\" height=\"40\" fill=\"#a78bfa\" opacity=\"0.6\"/>\n                <text x=\"350\" y=\"195\" textAnchor=\"middle\" fill=\"#a78bfa\" fontSize=\"8\">QWP<\/text>\n\n                {/* Combiner / BS */}\n                <g transform=\"translate(450, 115) rotate(-45)\">\n                  <rect x=\"-15\" y=\"-2\" width=\"30\" height=\"4\" fill=\"#94a3b8\"/>\n                <\/g>\n                <text x=\"450\" y=\"98\" textAnchor=\"middle\" fill=\"#cbd5e1\" fontSize=\"9\">BS<\/text>\n                <text x=\"450\" y=\"160\" textAnchor=\"middle\" fill=\"#64748b\" fontSize=\"8\">간섭 결합<\/text>\n\n                {/* 결합 신호 */}\n                <line x1=\"280\" y1=\"115\" x2=\"440\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"1.5\" strokeDasharray=\"3,2\" opacity=\"0.7\"/>\n                <line x1=\"450\" y1=\"115\" x2=\"550\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"2\" className=\"glow-amber\"/>\n                \n                {/* Polarizer */}\n                <rect x=\"555\" y=\"100\" width=\"6\" height=\"30\" fill=\"#22d3ee\" opacity=\"0.6\"/>\n                <text x=\"558\" y=\"95\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"8\">P<\/text>\n\n                {/* 광섬유 출력 */}\n                <line x1=\"565\" y1=\"115\" x2=\"620\" y2=\"115\" stroke=\"#fbbf24\" strokeWidth=\"2\" className=\"glow-amber\"/>\n                <rect x=\"620\" y=\"100\" width=\"60\" height=\"30\" fill=\"#0f172a\" stroke=\"#a78bfa\" strokeWidth=\"2\" rx=\"3\"/>\n                <text x=\"650\" y=\"118\" textAnchor=\"middle\" fill=\"#a78bfa\" fontSize=\"9\" fontWeight=\"bold\">Fiber Out<\/text>\n\n                {/* 검출기 */}\n                <line x1=\"680\" y1=\"115\" x2=\"730\" y2=\"115\" stroke=\"#a78bfa\" strokeWidth=\"2\"/>\n                <rect x=\"730\" y=\"95\" width=\"50\" height=\"40\" fill=\"#0f172a\" stroke=\"#a78bfa\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"755\" y=\"115\" textAnchor=\"middle\" fill=\"#a78bfa\" fontSize=\"9\" fontWeight=\"bold\">PD<\/text>\n                <text x=\"755\" y=\"128\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"8\">검출기<\/text>\n\n                {/* 신호 처리 */}\n                <rect x=\"600\" y=\"200\" width=\"180\" height=\"60\" fill=\"#0f172a\" stroke=\"#4ade80\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"690\" y=\"220\" textAnchor=\"middle\" fill=\"#4ade80\" fontSize=\"10\" fontWeight=\"bold\">Phase Meter<\/text>\n                <text x=\"690\" y=\"235\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"9\">FPGA · Phase-Locked Loop<\/text>\n                <text x=\"690\" y=\"250\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"9\">→ 위치값 (20 kHz)<\/text>\n\n                {/* 참조 신호 */}\n                <rect x=\"20\" y=\"200\" width=\"60\" height=\"40\" fill=\"#0f172a\" stroke=\"#22d3ee\" strokeWidth=\"2\" rx=\"4\"/>\n                <text x=\"50\" y=\"220\" textAnchor=\"middle\" fill=\"#22d3ee\" fontSize=\"9\" fontWeight=\"bold\">Ref PD<\/text>\n                <text x=\"50\" y=\"232\" textAnchor=\"middle\" fill=\"#94a3b8\" fontSize=\"8\">f₂ - f₁<\/text>\n                <line x1=\"80\" y1=\"220\" x2=\"600\" y2=\"230\" stroke=\"#64748b\" strokeWidth=\"1\" strokeDasharray=\"3,2\"/>\n              <\/svg>\n\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4 mt-6\">\n                <div className=\"bg-slate-950/60 border border-cyan-900/30 rounded-lg p-4\">\n                  <div className=\"text-cyan-400 font-semibold mb-2\">핵심 컴포넌트<\/div>\n                  <div className=\"space-y-1.5 text-xs text-slate-300\">\n                    <div><span className=\"text-amber-400\">PBS<\/span>: 편광 빔스플리터, f₁/f₂를 편광으로 분리<\/div>\n                    <div><span className=\"text-amber-400\">QWP<\/span>: 1/4 파장판, 직선 → 원편광 변환<\/div>\n                    <div><span className=\"text-amber-400\">Grating<\/span>: 입사빔을 ±1차로 회절<\/div>\n                    <div><span className=\"text-amber-400\">BS Combiner<\/span>: 두 회절빔을 다시 간섭시킴<\/div>\n                    <div><spa
